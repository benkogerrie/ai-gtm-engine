name: Security

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    name: Snyk SCA / SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      - name: Snyk SCA
        id: snyk-sca
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk test
          --all-projects
          --dev
          --severity-threshold=high
          --sarif-file-output=snyk-sca.sarif
          --json-file-output=snyk-sca.json

      - name: Snyk SAST
        id: snyk-sast
        if: success() || failure()
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: >
          snyk code test
          --severity-threshold=high
          --sarif-file-output=snyk-code.sarif
          --json-file-output=snyk-code.json

      - name: Upload Snyk reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snyk-reports
          path: |
            snyk-sca.sarif
            snyk-sca.json
            snyk-code.sarif
            snyk-code.json
          if-no-files-found: warn
